name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Boot-time validation requires these; they are not secrets in CI.
  DATABASE_URL: postgresql://forgeroutine:forgeroutine@localhost:5432/forgeroutine_test?schema=public
  DIRECT_DATABASE_URL: postgresql://forgeroutine:forgeroutine@localhost:5432/forgeroutine_test?schema=public
  JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdefghijklmnopqrstuv
  JWT_REFRESH_SECRET: ci-refresh-secret-vutsrqponmlkjihgfedcba9876543210
  REDIS_ENABLED: 'false'
  EXECUTION_DRIVER: inline

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached end of life in April 2026. 22 is maintenance LTS,
        # 24 is active LTS. Both are tested because Node renamed the sandbox's
        # permission-model flag between them (--experimental-permission ->
        # --permission), and that difference is invisible on one version.
        node: [22, 24]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forgeroutine
          POSTGRES_PASSWORD: forgeroutine
          POSTGRES_DB: forgeroutine_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json's `packageManager` field is
      # the single source of truth; declaring it twice makes the action refuse
      # to run (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Report sandbox isolation support
        # Surfaces which permission flag this runtime accepts, so a silent loss
        # of filesystem isolation shows up in the log rather than in production.
        run: |
          node --permission --allow-fs-read=* -e 'process.exit(0)' 2>/dev/null             && echo "permission model: --permission"             || (node --experimental-permission --allow-fs-read=* -e 'process.exit(0)' 2>/dev/null                 && echo "permission model: --experimental-permission"                 || echo "permission model: UNAVAILABLE")

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @forgeroutine/database exec prisma migrate deploy

      - name: Verify the migration matches the schema
        # Catches a schema edit that was committed without its migration —
        # which would pass every test here and then fail on deploy.
        run: |
          pnpm --filter @forgeroutine/database exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code && echo "Schema and migrations agree"

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

      - name: Test
        # The sandbox suite spawns real child processes; Linux runners have the
        # Node permission model, so this also exercises the isolation path that
        # Windows development cannot.
        run: pnpm test

      - name: Seed check
        run: pnpm db:seed

      - name: Vertical slice (end to end)
        # The §48 milestone, against a real database and a real sandbox.
        # No OPENAI_API_KEY here, so the evaluator exercises its degraded path.
        run: pnpm --filter @forgeroutine/api test:e2e

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. package.json's `packageManager` field is
      # the single source of truth; declaring it twice makes the action refuse
      # to run (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  mobile:
    name: Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: flutter analyze
      - working-directory: apps/mobile
        run: flutter test

      # Packaging is a separate failure mode from compiling, and only the
      # release variant exercises it. `flutter_local_notifications` needing
      # core library desugaring broke :app:checkReleaseAarMetadata while
      # analyze and test both passed — so a project that could not be built
      # at all went green here and failed in CD.
      #
      # The base URL is a placeholder: this proves the APK assembles, not
      # that it points anywhere useful. CD supplies the real one.
      - working-directory: apps/mobile
        run: flutter build apk --release --dart-define=API_BASE_URL=http://localhost:50005/api/v1
