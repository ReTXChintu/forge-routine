# ForgeRoutine — nginx (docs/deployment.md)
#
# TLS termination, static SPA, and a reverse proxy to the PM2-managed API.
# No containers; the API is a local process on 127.0.0.1:4000.

upstream forgeroutine_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Rate limiting at the edge, in front of the application's own per-user limits.
# This one is per-IP and exists to absorb floods before they reach Node at all.
limit_req_zone $binary_remote_addr zone=forgeroutine_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name forgeroutine.example.com;

    # ACME challenges must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name forgeroutine.example.com;

    ssl_certificate     /etc/letsencrypt/live/forgeroutine.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forgeroutine.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The app sends its own CSP via helmet; nothing is duplicated here.

    # Code submissions are text. 1 MB is generous and caps a trivial DoS vector.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    access_log /var/log/nginx/forgeroutine.access.log;
    error_log  /var/log/nginx/forgeroutine.error.log warn;

    # --- API ---------------------------------------------------------------
    location /api/ {
        limit_req zone=forgeroutine_api burst=40 nodelay;

        proxy_pass http://forgeroutine_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI responses are slow. 65s comfortably exceeds AI_REQUEST_TIMEOUT_MS
        # (60s), so the application's own timeout is the one that fires.
        proxy_read_timeout    65s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    65s;
    }

    # Streaming endpoints must not be buffered, or tokens arrive all at once
    # and the streaming UI is pointless.
    location /api/v1/ai/stream {
        proxy_pass http://forgeroutine_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }

    # Health checks: never logged, they would drown the access log.
    location = /api/v1/health/ready {
        proxy_pass http://forgeroutine_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Static SPA --------------------------------------------------------
    root /srv/forgeroutine/web;
    index index.html;

    # Hashed filenames are immutable; a year is safe and saves every revisit.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on old JS
    # pointing at new API contracts.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
