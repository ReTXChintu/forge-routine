name: forgeroutine_mobile
description: "ForgeRoutine — forge your coding skills. Build your engineering mind."
publish_to: 'none'
version: 0.1.1+4
environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  # Voice interview. Uses the platform recogniser, so nothing is recorded and
  # no audio leaves the device — only the transcript is sent, exactly as a
  # typed answer would be.
  speech_to_text: ^7.0.0
  # Daily routine reminders. Scheduled locally: a push backend for one
  # notification a day would be infrastructure with no user benefit.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
