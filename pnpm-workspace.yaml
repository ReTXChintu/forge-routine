packages:
  - 'apps/*'
  - 'packages/*'

# Dependencies permitted to run install scripts (pnpm 12 supply-chain policy).
allowBuilds:
  esbuild: true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  '@nestjs/core': true
  bcrypt: true
  unrs-resolver: true
  msgpackr-extract: true
  # Analytics postinstall only; nothing needs it to build.
  '@scarf/scarf': false
  # Its only install script is `prepare`, and `scripts/` is not in the
  # published tarball — there is nothing to run. `dist/` ships prebuilt.
  '@google/genai': false
  # postinstall prints a version-scheme warning to stderr and writes
  # nothing. Skipping it loses a message nobody reads.
  protobufjs: false
